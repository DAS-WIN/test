name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/SrbMinerMonitor.Tests -c Release
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build SrbMinerMonitor.slnx -c Release
      - run: ./scripts/Smoke-Windows.ps1
        shell: pwsh
      - run: ./scripts/Publish-Windows.ps1
        shell: pwsh
      - run: ./scripts/Verify-PublishedStartup.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation-and-portable
          path: |
            artifacts/screenshots
            artifacts/*.zip
